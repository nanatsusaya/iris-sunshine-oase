# Opening hours — the studio's real hours, confirmed by the owner on 2026-10-23.
#
# Source: the winter and summer opening-hours cards, transcribed verbatim in
# docs/sources/2026-10-23-flyer-and-hours-cards.md, plus the owner's answers there. The printed cards
# overlapped and left a gap at the season boundaries. The owner settled them: winter runs 1 November –
# 31 March, summer 1 April – 31 October, and Sunday in winter is 09:00 – 16:00 (the card's handwritten
# correction).
#
# Why there are several sets rather than one list: the hours change twice a year, and the build selects
# the set valid at build time (`currentHours()` in src/content/query.ts). `validUntil` is inclusive —
# the whole of that day. A build that falls where two sets overlap, or where none applies, fails.
#
# The seasons recur every year, but the schema holds dated sets. **A new season's set has to be added
# before the last one here expires** — see docs/recurring-tasks.md. A build after the last `validUntil`
# fails loudly rather than showing stale hours.
#
# Holidays are not here: the cards say „Bitte schauen Sie auf die aktuelle Vorankündigung", which is
# closures.yaml's job (ADR 0003 §4).

- id: sommer-2026
  label: Sommer-Öffnungszeiten (1. April – 31. Oktober)
  validFrom: 2026-04-01
  validUntil: 2026-10-31
  intervals:
    - days: [1, 2, 3]
      opens: "15:00"
      closes: "19:00"
    - days: [4, 5]
      opens: "09:00"
      closes: "12:30"
    - days: [4, 5]
      opens: "15:00"
      closes: "19:00"
    - days: [6, 7]
      opens: "09:00"
      closes: "12:30"
  confirmed: { by: owner, on: 2026-10-23, source: docs/sources/2026-10-23-flyer-and-hours-cards.md }

