# ⚠️  EVERY PRICE IN THIS FILE IS INVENTED. NONE OF THEM IS A PRICE OF THE STUDIO.
#
# The owner does not yet have the current figures and will supply them (2026-07-19). Under ADR 0003 R1
# the repository holds placeholders until then, and three things make that safe rather than reckless:
#
#   1. every entry is `confirmed: false`;
#   2. the `live` build FAILS on any unconfirmed entry — the gate is on the `confirmed` field in
#      src/content.config.ts, so it runs for every entry whether or not a page renders it. It fails
#      rather than hides: a price list that silently drops three services looks finished and is wrong;
#   3. the amounts are repdigits — 11,11 € / 22,22 € / 33,33 € — so they are false on sight. A plausible
#      invented figure is the most dangerous object in this repository, because it survives a screenshot
#      as though it were real.
#
# The service NAMES are not invented: they are the old site's, extracted verbatim to
# docs/content/ and listed in docs/analysis/03-services-and-prices.md. They are recorded there, not
# confirmed — that document's own header says so.
#
# This is a representative set, not the full ~40 items. It exists to exercise every price shape the
# schema must survive; transcribing the rest is Phase 3 content work and waits for the owner's figures
# (#41), since transcribing 2019 prices the owner is about to replace would be waste.
#
# NOTE — `id` must be the first key of every entry (see business.yaml).

