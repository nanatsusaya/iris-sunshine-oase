name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege, declared explicitly rather than inherited (ADR 0009 §3). The checks only read
# the repository; nothing here writes anything.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a full commit SHA (supply-chain hardening — a moved tag cannot
      # silently change what runs); the trailing comment tracks the human-readable version.
      # Since ADR 0009 (R2) this is enforced by repository policy rather than by convention, and
      # only GitHub-owned actions may run at all.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 24 is the active LTS line (ADR 0002 §2); Node 22 entered maintenance in October
          # 2025. Pinned to a major, not `latest`, so a Node release cannot change the build
          # unbidden. The pin ages deliberately — see docs/recurring-tasks.md.
          node-version: '24'
          cache: npm

      # `--ignore-scripts` is the supply-chain control that matters most here (ADR 0009 §2):
      # lifecycle scripts are the mechanism most npm attacks actually use, and they would run on
      # the machine holding the repository token. A static site build has no legitimate need of
      # them. `sharp` is the anticipated exception — it currently installs prebuilt binaries and
      # needs no script, but if `astro:assets` ever fails to find it once images exist, allowlist
      # `sharp` individually with a comment naming why, never by dropping this flag.
      - name: Install
        run: npm ci --ignore-scripts

      # Blocks on high and critical only (ADR 0009 §2). Moderate and low are reported without
      # failing, because a gate that fires constantly gets bypassed as a habit and then fails to
      # fire when it matters.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      # Type checking is not a side effect of `astro build`: Astro's documentation is explicit that
      # `tsc` ignores `.astro` files entirely, so this is its own step (ADR 0002 §3).
      - name: Typecheck
        run: npm run check:types

      # Blocking from the start, by owner decision (ADR 0002 §5, R1). An advisory check is one
      # nobody reads.
      - name: Lint and format
        run: npm run check:lint

      - name: Build
        run: npm run build

      - name: Documentation conformance
        run: npm run check:docs

      # ADR 0004 §10: the token system's own rules — no raw colour, no off-scale spacing, and the
      # contrast figures hold. Reads the source rather than the build, because the point is to name
      # the file and line that introduced the value.
      - name: Design tokens
        run: npm run check:tokens

      # ADR 0003 §7. Covers what Astro does not: a duplicate id is only a *warning* there and the
      # build still exits 0, silently overwriting one entry with another.
      - name: Content model
        run: npm run check:content

      # ADR 0009 §6 as a check rather than a rule to remember: the built output must fetch nothing
      # from a third party. Reads dist/, so it has to follow the build.
      - name: No external resources
        run: npm run check:external
