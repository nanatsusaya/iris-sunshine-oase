# The studio's services and prices — the one authority for what is offered and what it costs.
#
# Confirmed entries come from the owner on 2026-10-23 (ADR 0003 §8):
#
#   - **Naturkosmetik and Massagen** — the current Moments flyer, whose prices „gelten ab 01.12.2021"
#     and which the owner confirmed as current. Verbatim transcription:
#     docs/sources/2026-10-23-flyer-and-hours-cards.md. Where the flyer and the old website disagree,
#     the flyer wins; the differences are tabulated there.
#   - **Solarium** — the old website's prices (docs/analysis/03-services-and-prices.md), on the owner's
#     instruction to use them provisionally: „nimm erstmal die preise von der webseite". Their `source`
#     says so, so a later correction knows where to look.
#   - **Kombipaket mit straffender Maske, Stammkundenkarte, 10er-Karten, Wert-Gutschein** — not on the
#     flyer; the old website's values, which the owner confirmed as current on 2026-10-24: „die preise
#     stimmen noch sowie die gutscheine".
#
# Still `confirmed: false`, with a repdigit placeholder that is false on sight (ADR 0003 R1): the
# Fußreflexzonen-Massage. The owner confirmed it as still offered, but the old website showed no price
# for it („zZ. vergriffen"), so there is nothing to confirm yet. The `live` build refuses it.
#
# No longer offered, and so removed (owner, 2026-10-23): Aufbaubehandlung Hyaluron/Ceramide,
# Hotstone-Rückenmassage, Wellness-Pakete and Freundinnen-Wellness-Pakete.
#
# Amounts are integer cents. NOTE — `id` must be the first key of every entry (see business.yaml).

