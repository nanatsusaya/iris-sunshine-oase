# Identity and contact details — the one authoritative copy (ADR 0003 §9).
#
# This replaces the table in docs/business-facts.md, which held these under an explicit "interim
# location" notice until a content model existed. That file is now a pointer to this one.
#
# These are the business's own details and § 5 TMG requires a German commercial website to state them
# publicly, so publishing them here is fine. Nothing belonging to a third party is in this repository.
#
# NOTE — `id` must be the first key of every entry. tools/check-content.mjs asserts it, because its
# duplicate-id scan reads these files as text: Astro's own loader only *warns* on a duplicate id and
# the build still exits 0, silently overwriting one entry with another.

- id: trading-name
  value: Kosmetik- & Sonnenstudio Iris’ Sunshine Oase
  # Two authorities, deliberately: the extract for the wording, the owner for the apostrophe. The old
  # site spelled the name both ways — a straight ' in the header, a typographic ’ in the hero — and the
  # 2026 design draft reproduced exactly that split, 39 times one way and 18 the other.
  source: docs/inhalte/seiten/impressum.md (wording); owner 2026-07-19, ADR 0004 R5 (apostrophe)
  confirmed: { by: owner, on: 2026-07-19 }

- id: proprietor
