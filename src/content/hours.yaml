# ⚠️  EVERY TIME IN THIS FILE IS INVENTED. THESE ARE NOT THE STUDIO'S OPENING HOURS.
#
# The owner does not yet have the current hours and will supply them (2026-07-19). Under ADR 0003 R1
# these are placeholders: `confirmed: false`, so the `live` build refuses them, and the times are
# implausible clock values on purpose. A tidy `10:00 – 18:00` would survive a screenshot as though it
# were real; 11:11 – 22:22 cannot.
#
# Why sets carry a validity rather than there being one list: docs/analysis/02-content-inventory.md records
# that the WordPress export holds **two conflicting summer sets with differing Sunday hours**. A model
# that can hold only one gets resolved by somebody deleting the other, and the wrong one is exactly as
# likely as the right one. So both can exist and the build selects.
#
# An absent `validUntil` means "until replaced", not "forever".

- id: placeholder-standard
  label: Platzhalter — Regelzeiten
  intervals:
    - days: [1, 2, 3, 4, 5]
      opens: "11:11"
      closes: "22:22"
    - days: [6, 7]
      opens: "09:09"
      closes: "12:12"
  confirmed: false
