version: 2

updates:
  # The CI workflow pins actions to commit SHAs, which is what makes a moved tag harmless — but a
  # pinned SHA also never picks up a security fix on its own. Dependabot is what keeps the pins
  # current; without it, pinning trades one risk for another.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    labels:
      - 'type:chore'
      - 'area:infra'

  # The npm tree is the dominant risk in this project (ADR 0009 §2): Astro and Biome bring a large
  # transitive set whose code executes in CI. Dependabot is also what keeps the SHA-pinned actions
  # above current — pinning without it would trade one risk for another.
  #
  # **A Dependabot pull request is reviewed like any other.** A dependency update that changes what
  # the built output contains is not routine, and this is a public site for a real business.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    labels:
      - 'type:chore'
      - 'area:build'
    groups:
      # One PR for the routine minor and patch churn, so review attention goes to the updates that
      # actually change something. Majors stay separate and are read individually.
      dev-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript 7 is held back by `@astrojs/check`, whose peer range is
      # `^5.0.0 || ^6.0.0` and has not widened. *Which* release that range was last read from is a
      # fact with exactly one authority — the recurring task in `docs/recurring-tasks.md` — because
      # a version number restated here ages silently, and this comment did: it named 0.9.9 as the
      # latest release, which 0.9.10 replaced on 2026-07-27. Dependabot proposed 7.0.2 in #32 and CI
      # refused the install, which is the check chain working: the conflict was caught on the PR
      # instead of on `main`.
      #
      # **Deliberately `>=7`, not "no majors".** TypeScript 6 *is* inside the peer range, so an
      # offer to move to it is legitimate and should still arrive. Blocking every major would
      # suppress a valid upgrade to suppress an invalid one.
      #
      # **Revisit trigger:** when `@astrojs/check` widens its peer range to include `^7`. That is a
      # calendar-free condition nobody would notice, so it is written down as a recurring task
      # (`docs/recurring-tasks.md`) rather than left in this comment alone.
      - dependency-name: typescript
        versions: ['>=7']
